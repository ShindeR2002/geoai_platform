[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "geoai-platform"
version = "2.0.0"
description = "Production-grade GeoAI Platform for PS10 Anthropogenic Change Detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

dependencies = [
    "rasterio>=1.3.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "fiona>=1.9.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-image>=0.21.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "streamlit>=1.29.0",
    "folium>=0.15.0",
    "streamlit-folium>=0.11.0",
]

[project.optional-dependencies]
explainability = ["shap>=0.43.0"]
dev = [
    "pytest>=7.4.0",
    "httpx2>=0.1.0",
]

[project.scripts]
geoai-run = "run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geoai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools]
py-modules = ["run_pipeline"]
